# Nguồn giá duy nhất: terminal Exness MetaTrader 5 đang đăng nhập.
exness:
  # Để trống nếu MetaTrader5 tự tìm thấy terminal; nếu có nhiều terminal, điền
  # đường dẫn terminal64.exe của Exness tại đây hoặc EXNESS_MT5_PATH trong .env.
  terminal_path: ""
  timeout_ms: 15000
  portable: false
  # Hard-fail nếu terminal đang đăng nhập broker khác, tránh trộn nguồn dữ liệu.
  require_exness_server: true

# Danh sách nhỏ, chỉ gồm vàng và cổ phiếu Mỹ thanh khoản/vốn hóa lớn.
# Nếu tài khoản Exness không có một mã, bot báo một lần rồi tự bỏ qua mã đó.
assets:
  # mode hiện bị khóa ở signal_only: chỉ phân tích/gửi Telegram, không gửi lệnh MT5.
  - {symbol: XAUUSD, name: Gold, type: metal, mode: signal_only, scan_minutes: 1, enabled: true}
  - {symbol: AAPL, name: Apple, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: NVDA, name: NVIDIA, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: MSFT, name: Microsoft, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: AMZN, name: Amazon, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: GOOGL, name: Alphabet, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: META, name: Meta, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: TSLA, name: Tesla, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: AVGO, name: Broadcom, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: JPM, name: JPMorgan, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: WMT, name: Walmart, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}
  - {symbol: FTNT, name: Fortinet, type: stock, mode: signal_only, scan_minutes: 5, enabled: true}

scanner:
  # Chỉ lấy lại khung vừa đến hạn; các khung còn lại dùng cache nến đóng.
  timeframes: [1min, 5min, 15min, 1h, 4h, 1day]
  # >=800 nến là bắt buộc để EMA200 hội tụ; ở 260 nến thì ~7.4% giá trị EMA200
  # vẫn là nến seed đầu tiên, làm live lệch backtest và đảo dấu close-vs-EMA200.
  bars_per_timeframe: 1000
  close_settle_seconds: 8

strategy:
  # 15m thay vi 5m: o 5m spread an 3.47% risk moi lenh (SL toi thieu chi 3.23$),
  # 15m con 1.90%. Do tren 15 thang tick that: 5m -23.25R / 15m +23.76R.
  entry_interval: 15min

  # Thien huong khung ngay la bo loc CUNG, khong phai mot so hang co trong so.
  # Bot da mo 150 lenh SHORT trong song tang 70% va lo 34.75R vi thieu no.
  # NEUTRAL cung chan lenh: khung ngay chua nga ngu thi khong vao.
  bias_interval: 1day
  bias_fallback_interval: 4h
  require_bias_alignment: true
  # RSI có trọng số lớn nhất nhưng phải đồng thuận EMA/MACD/ADX đa khung.
  intraday_weights:
    1min: 0.05
    5min: 0.20
    15min: 0.30
    1h: 0.30
    4h: 0.15
  long_term_weights:
    1h: 0.20
    4h: 0.50
    1day: 0.30
  # DA THU siet len 0.40/0.20. Trong mau thi rat dep (PF 2.02) nhung ra ngoai
  # mau sup con PF 1.015 (+0.50R tren 55 lenh) — dau hieu overfit dien hinh.
  # Giu 0.30/0.08: walk-forward cho PF 1.189 (trong mau) -> 1.105 (ngoai mau),
  # suy giam nhe va van duong o ca hai nua. Dung siet lai neu khong co bang
  # chung ngoai mau moi.
  actionable_score: 0.30
  alignment_floor: 0.08
  # Không mua khi RSI đã quá nóng và không short khi RSI đã quá bán.
  rsi_long_zone: [45, 68]
  rsi_short_zone: [32, 55]
  retest_lookback_bars: 8
  retest_tolerance_atr: 0.18
  minimum_rejection_close_location: 0.60
  entry_tolerance_atr: 0.18
  maximum_spread_atr: 0.12
  # Sàn biến động: ATR khung vào lệnh phải >= 0.02% giá, nếu không thì bỏ qua
  # (feed đứng/nghỉ lễ vẫn có thể cho score cao trên đúng một tick).
  minimum_atr_ratio: 0.0002
  stop_buffer_atr: 0.18
  minimum_stop_atr: 0.65
  maximum_stop_atr: 2.0
  # Mức hủy setup cố định quanh cấu trúc retest, chỉ dùng sau xác nhận nến đóng.
  invalidation_buffer_atr: 0.12
  take_profit_1_r: 1.5
  take_profit_2_r: 2.5

position_exit:
  # Không thoát chỉ vì một wick hoặc RSI đơn lẻ. Cần phá cấu trúc + động lượng,
  # hoặc ít nhất 2/3 khung 15m/1H/4H đảo chiều đồng thuận.
  adverse_score_floor: 0.08
  alignment_floor: 0.08
  time_stop_bars_5m: 24
  minimum_progress_r: 0.50

alerts:
  telegram_enabled: true
  entry_alerts: true
  signal_cooldown_minutes: 60
  four_hour_summary: true
  daily_summary: true
  state_path: logs/exness_alert_state.json
  # Nhat ky tin hieu forward: moi tin Entry phat ra ghi mot dong JSON.
  # Day la thu duy nhat cho phep cham diem hieu qua khi chay demo.
  journal_path: logs/signal_journal.jsonl
